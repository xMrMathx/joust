<script>
"use strict";
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let VW=0,VH=0,DPR=1;
function resize(){DPR=Math.min(devicePixelRatio||1,2);VW=innerWidth;VH=innerHeight;cv.width=VW*DPR;cv.height=VH*DPR;cv.style.width=VW+'px';cv.style.height=VH+'px'; fitCam();}
addEventListener('resize',resize);
const W=2200,H=2200,C=1100,ARM=150;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const LAIRS=[{x:C+335,y:C},{x:C-335,y:C}];
const CCENTERS=[{x:C-560,y:C,ax:-1},{x:C+560,y:C,ax:1}];
function inCBand(x,y){ for(const P of CCENTERS){ const vx=x-P.x, vy=y-P.y, r=Math.hypot(vx,vy);
  if(r>214&&r<386&&(vx*P.ax)/r>-0.42)return true; } return false; }
const MAPS={
 plus:{id:'plus',title:'PLUS — last team standing',teams:[0,1,2,3],ring:true,orbs:true,chest:true,alliance:true,warMode:'ring',ground:'plus',grove:false,camps:null,
  hint:'PLUS — four teams, last team standing. The jungle is walled in trees — in through the mouths. The WARLORE walks the ring road. The Chest floats home.'},
 gate:{id:'gate',title:'THE GATE — last team standing',teams:[0,1],ring:false,orbs:false,chest:false,alliance:false,warMode:'pace',ground:'lane',grove:false,
  camps:[{x:C-560,y:C},{x:C+560,y:C}],
  hint:'THE GATE — one lane, two teams. Take the jungle camps for the buff, win the WARLORE, break their Titan.'},
 grove:{id:'grove',title:'SANCTUARY GROVE — last team standing',teams:[0,1],ring:false,orbs:false,chest:false,alliance:false,warMode:'pace',ground:'lane',grove:true,
  camps:[{x:C-560,y:C},{x:C+560,y:C}],
  hint:'SANCTUARY GROVE — one lane through the deep green. Camps, the WARLORE, and one Titan to break.'},
};
let MAP=MAPS.plus, TEAMS=MAP.teams;
let seed=11; const rnd=()=>{seed=(seed*16807)%2147483647;return (seed-1)/2147483646;};
const inLane=(x,y)=> (Math.abs(x-C)<ARM+36) || (Math.abs(y-C)<ARM+36);
// ---------- the jungle: TRACED IN TREES (his law, Bible 13.9) ----------
const JR_IN=400, JR_OUT=758, JR_MID=552, JR_HALF=80;
const polar=(ang,r)=>({x:C+Math.cos(ang)*r, y:C+Math.sin(ang)*r});
const angOf=(x,y)=>Math.atan2(y-C,x-C), radOf=(x,y)=>Math.hypot(x-C,y-C);
const angNorm=a=>{ while(a>Math.PI)a-=Math.PI*2; while(a<-Math.PI)a+=Math.PI*2; return a; };
const ringJungle=(x,y)=>{ const r=radOf(x,y); return r>JR_IN&&r<JR_OUT; };
function laneJungle(x,y){ for(const P of CCENTERS)if(Math.hypot(x-P.x,y-P.y)<240)return true;
  for(const L of LAIRS)if(Math.hypot(x-L.x,y-L.y)<132)return true; return false; }
const inJungle=(x,y)=> MAP.ring? ringJungle(x,y) : laneJungle(x,y);
const quadOf=ang=>{ const q=Math.round((ang-Math.PI/4)/(Math.PI/2))%4; return (q+4)%4; };
// each quadrant's mouth opens toward its owning team's arm (centre - 32 degrees)
const MOUTH=[]; for(let q=0;q<4;q++){ const cen=Math.PI/4+q*Math.PI/2; MOUTH.push({q,cen,ang:cen-0.56}); }
function jungleOpen(x,y){ // true = no tree stands here (roads, ring road, mouths, clearings, lanes)
  if(inLane(x,y))return true;
  const r=radOf(x,y); if(r<JR_IN-26||r>JR_OUT+44)return true;
  if(Math.abs(r-JR_MID)<JR_HALF)return true;
  const a=angOf(x,y);
  for(const m of MOUTH)if(Math.abs(angNorm(a-m.ang))<0.14)return true;
  for(let q=0;q<4;q++){ const p=polar(Math.PI/4+q*Math.PI/2,555); if(Math.hypot(x-p.x,y-p.y)<118)return true; }
  return false; }
const trees=[], colliders=[];
const CGRID=new Map();
function rebuildGrid(){ CGRID.clear(); for(const c of colliders){ const k=Math.floor(c.x/90)+':'+Math.floor(c.y/90);
  if(!CGRID.has(k))CGRID.set(k,[]); CGRID.get(k).push(c); } }
function distSeg(px,py,x1,y1,x2,y2){ const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy||1; let t=((px-x1)*dx+(py-y1)*dy)/L2;
  t=t<0?0:t>1?1:t; return Math.hypot(px-(x1+t*dx), py-(y1+t*dy)); }
function laneOpen(x,y){ if(Math.abs(x-C)<196)return true;
  if(Math.hypot(x-C,y-C)<268)return true;
  for(const t of TEAMS){ const p=armPt(t,1010); if(Math.hypot(x-p.x,y-p.y)<248)return true; }
  for(const P of CCENTERS)if(Math.hypot(x-P.x,y-P.y)<240)return true;
  for(const L of LAIRS)if(Math.hypot(x-L.x,y-L.y)<132)return true;
  for(const P of CCENTERS)if(distSeg(x,y,C+(P.x>C?196:-196),C,P.x,C)<88)return true;
  return false; }
function buildTrees(){ trees.length=0; colliders.length=0;
  if(MAP.ring){
    for(let gx=24;gx<W;gx+=35)for(let gy=24;gy<H;gy+=35){ const jx=gx+(rnd()*22-11), jy=gy+(rnd()*22-11);
      if(jungleOpen(jx,jy))continue; const r=radOf(jx,jy); if(r<JR_IN-20||r>JR_OUT+26)continue;
      trees.push({x:jx,y:jy,s:.88+rnd()*.55,k:rnd()<.62?'round':'pine',wall:true}); }
    for(let i=0;i<130;i++){ const x=rnd()*W,y=rnd()*H; if(inLane(x,y))continue; const r=radOf(x,y);
      if(r>JR_IN-44&&r<JR_OUT+74)continue; if(r<272)continue;
      trees.push({x,y,s:.7+rnd()*.8,k:rnd()<.5?'round':'pine',wall:false}); }
  } else {
    const step=MAP.grove?32:36, decorP=MAP.grove?0.20:0.09, roundP=MAP.grove?0.85:0.62;
    for(let gx=24;gx<W;gx+=step)for(let gy=24;gy<H;gy+=step){ const jx=gx+(rnd()*22-11), jy=gy+(rnd()*22-11);
      if(inCBand(jx,jy)){ if(rnd()<0.94)trees.push({x:jx,y:jy,s:.9+rnd()*.55,k:rnd()<roundP?'round':'pine',wall:true}); continue; }
      if(laneOpen(jx,jy))continue; if(rnd()<decorP)trees.push({x:jx,y:jy,s:.7+rnd()*.7,k:rnd()<roundP?'round':'pine',wall:false}); }
  }
  for(const t of trees)if(t.wall)colliders.push({x:t.x,y:t.y,r:17});
  rebuildGrid(); }
buildTrees();
function pushOut(u,ur){ if(u._brush)return; const gx=Math.floor(u.x/90), gy=Math.floor(u.y/90);
  for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){ const cell=CGRID.get((gx+i)+':'+(gy+j)); if(!cell)continue;
    for(const c of cell){ const dx=u.x-c.x, dy=u.y-c.y, d=Math.hypot(dx,dy), min=ur+c.r;
      if(d>0.01&&d<min){ u.x=c.x+dx/d*min; u.y=c.y+dy/d*min; } else if(d<=0.01){ u.x=c.x+min; } } } }
const grass=[]; for(let i=0;i<260;i++){const x=rnd()*W,y=rnd()*H; if(inLane(x,y))continue; grass.push({x,y,s:.5+rnd()*1.1,r:rnd()*3});}
const TEAMCOL=['#35a2ff','#ff4757','#2ed573','#e8b64c'], TEAMNAME=['BLUE','RED','GREEN','GOLD'];
const DIR=[{x:0,y:1},{x:0,y:-1},{x:-1,y:0},{x:1,y:0}];
function armPt(team,d){ const dir=DIR[team]; return{x:C+dir.x*d, y:C+dir.y*d}; }
let agents=[],minions=[],fx=[],texts=[],structs=[],camps=[],projs=[],over=false,perfT=0,feedMsg='',feedT=0,waveT=2;
let sel=null,camMode='follow',curSrc=null;
const PCOL={nova:'#ffe27a',onyx:'#c39bff',pyre:'#ff9a3c',koda:'#a8e063',sable:'#8affa0',mira:'#aee9ff'};
const ABNAME={rook:'Shield Slam',bram:'Tremor',nova:'Chain Bolt',onyx:'Void Pull',pyre:'Ember Spill',vex:'Fang Dash',koda:'Triple Shot',sable:'Mend',mira:'Ice Prison',talon:'Chain Hook',creed:'Execution',juno:'Root Snare'};
let buffs=[0,0,0,0];
const cam={x:C,y:C,s:.5,tx:C,ty:C};
let camFit=.5, camZoom=1;
function fitCam(){ if(VW&&VH){ camFit=Math.min(VW,VH)/1150; cam.s=camFit*camZoom; } }
function setZoom(z){ camZoom=clamp(z,.55,2.6); cam.s=camFit*camZoom; }
function pinchZoom(d0,d1,z0){ return clamp(z0*(d1/Math.max(1,d0)),.55,2.6); }
function struct(team,kind,d,hp,r){ const p=armPt(team,d); return{team,kind,x:p.x,y:p.y,hp,max:hp,r,alive:true,d}; }
function camp(x,y){return{x,y,hp:800,max:800,alive:true,respawn:0,r:48};}
const warlore={name:'WARLORE',x:0,y:0,hp:2800,max:2800,alive:true,mode:'ring',team:-1,ang:0.8,allyT:0,respawnT:0,atkT:0,stun:0,swingT:0,r:40,dmg:55,rng:74,spd:26,bob:0,face:1};
const chest={x:C,y:C,r:36,moving:-1};
let orbs=[], installed=[0,0,0,0];
let allyPairs=[], allyCards=[2,2,2,2], allyAiT=18, thinkAmbT=4;
function areAllied(t1,t2){ return t1===t2||allyPairs.some(p=>(p.a===t1&&p.b===t2)||(p.a===t2&&p.b===t1)); }
function say(a,txt){ if(a&&a.name){ a.thinkTxt=txt; a.thinkT=2.8;
  if(a.team>=0&&TEAMNAME[a.team]&&a._chatLast!==txt){ a._chatLast=txt;
    chatAdd('<b style="color:'+TEAMCOL[a.team]+'">'+TEAMNAME[a.team]+' '+a.name+':</b> '+txt); } } }
const chatLogEl=document.getElementById('chatLog');
function chatAdd(html,cls){ if(!chatLogEl)return; const d=document.createElement('div'); d.className='cl'+(cls?' '+cls:''); d.innerHTML=html; chatLogEl.appendChild(d); while(chatLogEl.children.length>42)chatLogEl.removeChild(chatLogEl.firstChild); chatLogEl.scrollTop=chatLogEl.scrollHeight; }
function orbPad(team){ const dir=DIR[team]; const ang=Math.atan2(dir.y,dir.x)+Math.PI/4; return{x:C+Math.cos(ang)*565, y:C+Math.sin(ang)*565}; }
const AGENT_DEFS=[
 {name:'ROOK', team:0,hp:1250,spd:56,rng:60,dmg:34,cd:0.9,kind:'rook'},
 {name:'BRAM', team:0,hp:1700,spd:47,rng:64,dmg:42,cd:1.1,kind:'bram'},
 {name:'NOVA', team:0,hp:820, spd:78,rng:220,dmg:30,cd:0.8,kind:'nova'},
 {name:'ONYX', team:1,hp:1000,spd:64,rng:195,dmg:34,cd:0.95,kind:'onyx'},
 {name:'PYRE', team:1,hp:980, spd:62,rng:125,dmg:36,cd:1.0,kind:'pyre'},
 {name:'VEX',  team:1,hp:880, spd:88,rng:58,dmg:40,cd:0.75,kind:'vex'},
 {name:'KODA', team:2,hp:860, spd:66,rng:250,dmg:30,cd:0.9,kind:'koda'},
 {name:'SABLE',team:2,hp:940, spd:58,rng:190,dmg:22,cd:1.0,kind:'sable'},
 {name:'MIRA', team:2,hp:900, spd:58,rng:200,dmg:26,cd:1.0,kind:'mira'},
 {name:'TALON',team:3,hp:920, spd:86,rng:64,dmg:42,cd:0.8,kind:'talon'},
 {name:'CREED',team:3,hp:1020,spd:70,rng:62,dmg:44,cd:0.95,kind:'creed'},
 {name:'JUNO', team:3,hp:880, spd:64,rng:170,dmg:28,cd:0.95,kind:'juno'},
];
function mkAgent(d,i){ const home=armPt(d.team,880); const off=(i%3-1)*90; const dir=DIR[d.team];
  return{...d,max:d.hp,swingT:0,hitT:0,x:home.x+(dir.y!==0?off:0),y:home.y+(dir.x!==0?off:0),alive:true,respawn:0,atkT:0,abT:3+Math.random()*3,abCd:0,level:1,lungeT:0,vx:0,vy:0,order:null,orbTask:null,chestTask:false,carrying:null,thinkT:0,thinkTxt:'',stun:0,face:1,bob:Math.random()*6}; }
function init(){
  agents=AGENT_DEFS.filter(d=>TEAMS.includes(d.team)).map(mkAgent); minions=[]; fx=[]; texts=[]; projs=[]; over=false; perfT=0; buffs=[0,0,0,0]; waveT=2; sel=null; allyPairs=[]; allyCards=[2,2,2,2]; allyAiT=18; allyArm=false;
  chest.x=C; chest.y=C; chest.moving=-1;
  structs=[]; { const f=MAP.ring?1:0.8; for(const t of TEAMS){ structs.push(struct(t,'titan',1010,Math.round(3000*f),80),struct(t,'phoenix',700,Math.round(1500*f),56),struct(t,'tower',400,Math.round(1200*f),50)); } }
  camps=[]; if(MAP.ring){ for(let q=0;q<4;q++){ const a=Math.PI/4+q*Math.PI/2; camps.push(camp(C+Math.cos(a)*545, C+Math.sin(a)*545)); } } else { for(const cp of MAP.camps)camps.push(camp(cp.x,cp.y)); }
  orbs=[]; installed=[0,0,0,0];
  if(MAP.orbs)for(const t of TEAMS){ const p=orbPad(t); for(let i=0;i<4;i++){ const a=i/4*Math.PI*2+0.4; orbs.push({owner:t,x:p.x+Math.cos(a)*30,y:p.y+Math.sin(a)*30,state:'home',carrier:null,pad:p}); } }
  Object.assign(warlore,{hp:warlore.max,alive:true,mode:MAP.warMode,team:-1,ang:0.8,allyT:0,respawnT:0,wp:0});
  const wp=MAP.ring?wlPos():LAIRS[0]; warlore.x=wp.x; warlore.y=wp.y;
  cam.x=C;cam.y=C;cam.tx=C;cam.ty=C;
  document.getElementById('banner').style.display='none'; feed(MAP.title);
  applyMapUI();
  resize();
}
function wlPos(){ return{x:C+Math.cos(warlore.ang)*JR_MID, y:C+Math.sin(warlore.ang)*JR_MID}; }
function feed(m){feedMsg=m;feedT=3.4;document.getElementById('feed').textContent=m; chatAdd(m,'feedline'); }
function dmgText(x,y,txt,col){texts.push({x,y,txt,col,t:0});}
// ---------- combat ----------
function chainHead(team){ const s=structs.filter(x=>x.team===team&&x.alive).sort((a,b)=>a.d-b.d); return s[0]||null; }
function teamOut(team){ return !structs.some(s=>s.team===team&&s.kind==='titan'&&s.alive); }
function hurt(t,d,srcTeam,isAgentHit){
  if(t.hp===undefined||t.hp<=0)return;
  let mult=1; if(srcTeam>=0&&perfT<buffs[srcTeam])mult=1.2;
  t.hp-=d*mult;
  if(t===warlore&&srcTeam>=0)warlore.lastHit=srcTeam;
  if(t.name){ t.lastHurt=perfT; if(t.recallT)t.recallT=0; }
  if(isAgentHit) dmgText(t.x+(Math.random()*30-15),t.y-56,Math.round(d*mult),'#ffe9a8');
  if(isAgentHit&&t.name){ t.hitT=0.14; fx.push({type:'sparks',x:t.x,y:t.y-34,t:0,dur:.28,col:'#ffe9a8'}); }
  if(t.hp<=0&&t.alive){ t.alive=false; onKill(t,srcTeam); }
}
function onKill(t,srcTeam){
  if(t===warlore){ const tm=warlore.lastHit!==undefined?warlore.lastHit:srcTeam;
    warlore.mode='ally'; warlore.team=tm; warlore.allyT=45; warlore.hp=warlore.max; warlore.alive=true;
    feed('The WARLORE rises for '+TEAMNAME[tm]+' — 45 seconds!'); return; }
  if(camps.includes(t)){ t.respawn=40; const near=agents.filter(a=>a.alive&&dist(a,t)<240).sort((x,y)=>dist(x,t)-dist(y,t))[0];
    if(near){ buffs[near.team]=perfT+25; feed(near.name+' took the camp — '+TEAMNAME[near.team]+' BUFFED'); } return; }
  if(t.name){ fx.push({type:'burst',x:t.x,y:t.y-24,t:0,dur:.45,col:TEAMCOL[t.team]}); feed(t.name+' is DOWN'); t.respawn=8; t.chestTask=false; t.orbTask=null; t.orbT=null; t.campTask=false; t._rt=null;

    feed('ALLIANCE — BLUE + '+TEAMNAME[ti]+' · 90 seconds'); }; });
// ---------- typed commands: same orders, no mic needed ----------
const typeBtn=document.createElement('button');
typeBtn.style.cssText='position:fixed;right:10px;top:239px;z-index:8;background:rgba(10,12,20,.88);color:#bcd8ff;border:1.5px solid #3f618f;border-radius:10px;padding:9px 12px;font-weight:bold;font-size:12.5px';
typeBtn.textContent='⌨️ TYPE'; document.body.appendChild(typeBtn);
const typeBar=document.createElement('div');
typeBar.style.cssText='position:fixed;right:10px;top:282px;z-index:9;display:none;gap:6px;width:min(330px,74vw)';
typeBar.innerHTML='<input id="cmdIn" type="text" placeholder="Nova, push lane" autocomplete="off" style="flex:1;background:rgba(10,12,20,.95);color:#fff;border:1.5px solid #b8860b;border-radius:10px;padding:10px 12px;font-size:14px">'
 +'<button id="cmdGo" style="background:#b8860b;color:#14100a;font-weight:bold;border:0;border-radius:10px;padding:10px 14px;font-size:13.5px">ORDER</button>';
document.body.appendChild(typeBar);
function sendTyped(){ const v=document.getElementById('cmdIn').value.trim(); if(!v)return;
  document.getElementById('cmdIn').value=''; voiceCommand(v); }
typeBtn.onclick=()=>{ const open=typeBar.style.display!=='flex';
  typeBar.style.display=open?'flex':'none';
  if(open)setTimeout(()=>{ const i=document.getElementById('cmdIn'); if(i)i.focus(); },60); };
document.getElementById('cmdGo').onclick=sendTyped;
document.getElementById('cmdIn').addEventListener('keydown',e=>{ if(e.key==='Enter')sendTyped(); });
// ---------- voice commands: precise, instant ----------
const micBtn=document.createElement('button');
micBtn.style.cssText='position:fixed;right:10px;top:153px;z-index:8;background:rgba(10,12,20,.88);color:#ffb3ab;border:1.5px solid #ff4757;border-radius:10px;padding:9px 12px;font-weight:bold;font-size:12.5px';
micBtn.textContent='🎤 VOICE'; document.body.appendChild(micBtn);
function clearTasks(a){ a.order=null; a.orbTask=null; a.orbT=null; a.chestTask=false; a.campTask=false; a._dq=null; a._stuck=0; a.recallT=0; a.atBase=false; }
function voiceCommand(raw){ const s=' '+String(raw).toLowerCase().replace(/[^a-z0-9' ]/g,' ')+' ';
  let a=null; for(const ag of agents)if(ag.team===0&&ag.alive&&s.includes(' '+ag.name.toLowerCase()))a=ag;
  if(!a)a=(sel&&sel.alive&&sel.team===0)?sel:agents.find(ag=>ag.team===0&&ag.alive);
  if(!a){ feed('No Agent to command'); return false; }
  clearTasks(a);
  if(/\borbs?\b/.test(s)&&MAP.orbs){ a.orbTask={}; sel=a; say(a,'Orb run — on it'); feed(a.name+': pushing ORBS'); return true; }
  if(/chest/.test(s)&&MAP.chest){ a.chestTask=true; sel=a; say(a,'Taking the chest home'); feed(a.name+': pushing CHEST'); return true; }
  if(/warlore|boss/.test(s)){ if(warlore.mode==='ring'){ a.order={target:warlore}; sel=a; say(a,'Going for the Warlore'); feed(a.name+': WARLORE'); return true; } }
  if(/lane|push/.test(s)){ const ct=s.includes('red')?1:s.includes('green')?2:(s.includes('yellow')||s.includes('gold'))?3:s.includes('blue')?0:-1;
    let t=ct; if(t<0||t===0||!TEAMS.includes(t)){ let bd=1e9; for(const k of TEAMS){ if(k===0)continue; const h=chainHead(k); if(h&&dist(a,h)<bd){bd=dist(a,h);t=k;} } }
    const h=chainHead(t); if(h){ a.order={target:h}; sel=a; say(a,'Pushing '+TEAMNAME[t]); feed(a.name+': pushing '+TEAMNAME[t]+"'s lane"); return true; } }
  if(/fall ?back|retreat/.test(s)){ const tp=armPt(0,950); a.order={x:tp.x,y:tp.y}; sel=a; say(a,'Falling back'); feed(a.name+': falling back'); return true; }
  if(/hold|defend|stay/.test(s)){ sel=a; say(a,'Holding here'); feed(a.name+': holding'); return true; }
  feed('Didn\'t catch that — try "'+a.name+' push orbs"'); return false; }
let recog=null;
micBtn.onclick=()=>{ const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ feed('No voice recognition in this viewer — open the game link in Chrome for voice, or use ⌨️ TYPE'); return; }
  if(recog){ recog.stop(); recog=null; micBtn.textContent='🎤 VOICE'; return; }
  recog=new SR(); recog.lang='en-US'; recog.interimResults=false;
  micBtn.textContent='🔴 LISTENING…'; feed('Listening, Coach…');
  recog.onresult=e=>{ const txt=e.results[0][0].transcript; voiceCommand(txt); };
  recog.onerror=e=>{ const c=e&&e.error;
    if(c==='not-allowed'||c==='service-not-allowed')feed('Mic is blocked — allow microphone access for this page, then tap VOICE again');
    else if(c==='network')feed('Voice service unreachable — check your connection');
    else if(c==='no-speech')feed('Didn\'t hear anything — tap VOICE and speak');
    else if(c==='audio-capture')feed('No microphone found on this device');
    else feed('Mic didn\'t catch that'); };
  recog.onend=()=>{ recog=null; micBtn.textContent='🎤 VOICE'; };
  try{ recog.start(); }catch(err){ recog=null; micBtn.textContent='🎤 VOICE'; } };
function s2w(px,py){ return{x:cam.x+(px-VW/2)/cam.s, y:cam.y+(py-VH/2)/(cam.s*0.88)}; }
function handleTap(px,py){ const wpt=s2w(px,py);
  let bestA=null,bd=52; for(const a of agents)if(a.alive&&a.team===0){const d=Math.hypot(a.x-wpt.x,a.y-26-wpt.y); if(d<bd){bd=d;bestA=a;}}
  if(bestA){ sel=bestA; return; }
  if(sel&&sel.alive){ let tgt=null,td=72;
    const pool=[...agents.filter(a=>a.alive&&a.team!==0),...minions.filter(m=>m.alive&&m.team!==0)];
    for(const e of pool){const d=Math.hypot(e.x-wpt.x,e.y-20-wpt.y); if(d<td){td=d;tgt=e;}}
    if(warlore.mode==='ring'&&Math.hypot(warlore.x-wpt.x,warlore.y-30-wpt.y)<td)tgt=warlore;
    for(const o of orbs)if(o.state==='home'&&o.owner!==0&&Math.hypot(o.x-wpt.x,o.y-wpt.y)<64){ clearTasks(sel); sel.orbTask={}; say(sel,'Orb run — on it'); feed(sel.name+' — going for an ORB'); return; }
    if(!tgt)for(const cp of camps)if(cp.alive&&Math.hypot(cp.x-wpt.x,cp.y-wpt.y)<76)tgt=cp;
    if(tgt){ clearTasks(sel); sel.order={target:tgt}; say(sel,'On it'); feed(sel.name+' → '+(tgt.name||(camps.includes(tgt)?'the camp':'target'))); return; }
    clearTasks(sel); sel.order={x:wpt.x,y:wpt.y}; say(sel,'Moving'); fx.push({type:'mark',x:wpt.x,y:wpt.y,t:0,dur:.7}); } }
let pDown=null,pinching=false,pinchD0=0,pinchZ0=1;
const activePtrs=new Map();
cv.addEventListener('pointerdown',e=>{ activePtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activePtrs.size===2){ const p=[...activePtrs.values()]; pinchD0=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y); pinchZ0=camZoom; pinching=true; pDown=null; }
  else if(activePtrs.size===1){ pDown={x:e.clientX,y:e.clientY,moved:false}; } });
cv.addEventListener('pointermove',e=>{ if(activePtrs.has(e.pointerId))activePtrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinching&&activePtrs.size>=2){ const p=[...activePtrs.values()]; setZoom(pinchZoom(pinchD0,Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),pinchZ0)); return; }
  if(!pDown)return;
  if(Math.hypot(e.clientX-pDown.x,e.clientY-pDown.y)>9)pDown.moved=true;
  if(pDown.moved&&camMode==='free'){ cam.tx=clamp(cam.tx-(e.movementX||0)/cam.s,505,1695); cam.ty=clamp(cam.ty-(e.movementY||0)/(cam.s*0.88),505,1695); cam.x=cam.tx; cam.y=cam.ty; } });
function ptrEnd(e){ activePtrs.delete(e.pointerId);
  if(pinching){ if(activePtrs.size<2)pinching=false; pDown=null; return; }
  if(pDown&&!pDown.moved)handleTap(e.clientX,e.clientY); pDown=null; }
cv.addEventListener('pointerup',ptrEnd);
cv.addEventListener('pointercancel',e=>{ activePtrs.delete(e.pointerId); if(activePtrs.size<2)pinching=false; pDown=null; });
cv.addEventListener('wheel',e=>{ e.preventDefault(); setZoom(camZoom*(e.deltaY<0?1.12:1/1.12)); },{passive:false});
const $=id=>document.getElementById(id);
$('pClose').onclick=()=>{ sel=null; };
$('pAb').onclick=()=>{ if(sel&&sel.alive&&sel.abCd<=0){ curSrc=sel; if(ability(sel)){ sel.abCd=6; } else { feed('No target in range for '+ABNAME[sel.kind]); sel.abCd=0.7; } } };
$('pOrb').onclick=()=>{ if(sel&&sel.alive){ clearTasks(sel); sel.orbTask={}; say(sel,'Orb run — on it'); feed(sel.name+' — ORB RUN'); } };
$('pPush').onclick=()=>{ if(sel&&sel.alive){ let best=null,bd=1e9; for(const t of TEAMS){ if(t===sel.team)continue; const h=chainHead(t); if(h&&dist(sel,h)<bd){bd=dist(sel,h);best=h;} }
  if(best){ clearTasks(sel); sel.order={target:best}; feed(sel.name+' — PUSH'); } } };
$('pBack').onclick=()=>{ if(sel&&sel.alive){ const tp=armPt(sel.team,950); clearTasks(sel); sel.order={x:tp.x,y:tp.y}; feed(sel.name+' — falling back'); } };
$('pHold').onclick=()=>{ if(sel&&sel.alive){ clearTasks(sel); feed(sel.name+' — holding'); } };
function uiTick(){
  orbHud.textContent= MAP.orbs ? ('ORBS ▸ BLU '+(4+installed[0])+'/8 · RED '+(4+installed[1])+'/8 · GRN '+(4+installed[2])+'/8 · GLD '+(4+installed[3])+'/8') : ''
    +(allyPairs.length?' · 🤝 '+allyPairs.map(p=>TEAMNAME[p.a].slice(0,3)+'+'+TEAMNAME[p.b].slice(0,3)+' '+Math.ceil(p.t)+'s').join(' · '):'');
  if(sel&&sel.alive){ panel.style.display='block';
    $('pName').textContent=sel.name+' · Lv '+sel.level;
    $('pInfo').textContent='HP '+Math.max(0,Math.ceil(sel.hp))+'/'+sel.max+(sel.carrying?' · CARRYING ORB':'')+(sel.orbTask?' · ON ORB RUN':'');
    const ab=$('pAb'); ab.textContent=sel.abCd>0?(ABNAME[sel.kind]+' · '+sel.abCd.toFixed(1)):ABNAME[sel.kind].toUpperCase();
    ab.style.opacity=sel.abCd>0?0.55:1; }
  else panel.style.display='none';
  if(chatLogEl)chatLogEl.style.bottom=panel.style.display==='block'?(panel.offsetHeight+24)+'px':'10px'; }
function applyMapUI(){ document.getElementById('hint').textContent=MAP.hint;
  document.querySelectorAll('.hud .tname').forEach((el,i)=>{ el.style.display=TEAMS.includes(i)?'':'none'; });
  document.querySelectorAll('.hud .bar').forEach((el,i)=>{ el.style.display=TEAMS.includes(i)?'':'none'; });
  allyBtn.style.display=MAP.alliance?'':'none';
  allyBtn.textContent='🤝 ALLIANCE · '+allyCards[0];
  document.getElementById('pOrb').style.display=MAP.orbs?'':'none';
  if(!MAP.orbs)orbHud.textContent=''; }
const mapsBtn=document.createElement('button');
mapsBtn.style.cssText='position:fixed;left:10px;top:110px;z-index:8;background:rgba(10,12,20,.88);color:#ffe9a8;border:1.5px solid #b8860b;border-radius:10px;padding:9px 12px;font-weight:bold;font-size:12.5px';
mapsBtn.textContent='🗺️ MAPS'; document.body.appendChild(mapsBtn);
mapsBtn.onclick=()=>{ document.getElementById('menu').style.display='flex'; document.getElementById('menuBack').style.display='block'; };
document.getElementById('menuBack').onclick=()=>{ document.getElementById('menu').style.display='none'; };
function startMap(id){ MAP=MAPS[id]; TEAMS=MAP.teams; buildTrees(); init(); makeGround();
  document.getElementById('menu').style.display='none'; }
document.querySelectorAll('.mapBtn').forEach(b=>{ b.onclick=()=>startMap(b.dataset.map); });
// ---------- loop ----------
init(); makeGround();
let lastTs=0;
function frame(ts){ requestAnimationFrame(frame); const dt=Math.min(.033,(ts-lastTs)/1000||.016); lastTs=ts; update(dt); draw(); uiTick(); }
requestAnimationFrame(frame);
</script>
